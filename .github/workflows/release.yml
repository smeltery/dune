name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  # package.json is the single source of the version: the published shim fetches its
  # binaries from `releases/download/v${version}`, so the release has to carry that
  # exact tag. A tag push disagreeing with package.json would upload the binaries to
  # one release while the shim fetched from another — the same broken install as no
  # release at all. Fail in ten seconds rather than after five runners have built.
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: version
        run: |
          version=v$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # One runner per platform: cross-compiling needs the target's @opentui/core-<platform>
  # package, and `bun install` only fetches the host's.
  build:
    needs: check
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: darwin-arm64
            os: macos-latest
          # The last Intel image Actions offers: macos-13 was retired in December
          # 2025, and x86_64 goes away entirely when this one retires in 2027.
          - target: darwin-x64
            os: macos-15-intel
          - target: linux-arm64
            os: ubuntu-24.04-arm
          - target: linux-x64
            os: ubuntu-latest
          - target: windows-x64
            os: windows-latest
          - target: linux-x64-baseline
            os: ubuntu-latest
          - target: windows-x64-baseline
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Prime the baseline compiler
        if: matrix.target == 'windows-x64-baseline'
        shell: pwsh
        run: |
          $version = (bun --version).Trim()
          $root = if ($env:BUN_INSTALL) { $env:BUN_INSTALL } else { "$env:USERPROFILE\.bun" }
          $cache = Join-Path $root 'install\cache'
          New-Item -ItemType Directory -Force -Path $cache | Out-Null
          $cached = Join-Path $cache "bun-windows-x64-baseline-v$version"
          Invoke-WebRequest -UseBasicParsing -OutFile baseline.zip `
            "https://github.com/oven-sh/bun/releases/download/bun-v$version/bun-windows-x64-baseline.zip"
          Expand-Archive -LiteralPath baseline.zip -DestinationPath baseline -Force
          Move-Item -Force 'baseline\bun-windows-x64-baseline\bun.exe' $cached
          Remove-Item -Recurse -Force baseline.zip, baseline
      - run: bun run build ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: dune-${{ matrix.target }}
          path: dist/${{ matrix.target }}/
          if-no-files-found: error

  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    # Every run of this job ships, by a tag push or by hand. Nothing here may be made
    # conditional on its own: package publication once carried no guard while the
    # release upload did, so a run published a package whose binaries were never
    # uploaded anywhere. Both steps go together.
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      # Node is here for GitHub Packages publication.
      - uses: actions/setup-node@v7
        with:
          node-version: latest
          registry-url: 'https://npm.pkg.github.com'
          scope: '@smeltery'
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: dune-*
      # download-artifact names each directory after the artifact; release.ts wants
      # dist/<target>/dune.
      - run: |
          cd dist
          for dir in dune-*; do mv "$dir" "${dir#dune-}"; done
          chmod +x */dune || true
      - run: bun run release
      - run: bun run formula
      # git, not `gh release create --target`: GITHUB_TOKEN may create a release for a
      # tag that already exists, but creating one that has to create the tag too comes
      # back `403 Resource not accessible by integration`. Pushing the tag over the
      # checkout's own credentials is plain `contents: write` and works, so a manual
      # run tags the commit here and the release step then finds the tag waiting.
      #
      # A tag push arrives with it already on the remote, and re-running a shipped
      # version reuses the tag it finds rather than moving it — the assets are
      # replaced below, and release.ts skips a version already on the registry.
      - name: Tag this commit
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "$VERSION is already tagged — reusing it"
          else
            git tag "$VERSION"
            git push origin "$VERSION"
          fi
      # Before package publication, not after: the published package holds no binary
      # and fetches one from this release, so an install landing between the two would
      # find nothing.
      - name: Publish the release with the binaries
        run: |
          gh release view "$VERSION" >/dev/null 2>&1 \
            || gh release create "$VERSION" --title "$VERSION" --generate-notes
          gh release upload "$VERSION" dist/release/* --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish to GitHub Packages
        run: bun run release --publish
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}

  # Homebrew installs come from smeltery/homebrew-tap, where Formula/dune.rb is the
  # source of truth for `brew install smeltery/tap/dune`. This job copies the formula
  # that was already generated and uploaded with the release, so it stays checksummed
  # against the archives and bottle assets users will download.
  #
  # This is separate from publish because GITHUB_TOKEN cannot write to another
  # repository. TAP_TOKEN should be a fine-grained PAT with contents:write on the tap.
  # Repositories without that secret still ship every other channel; the formula remains
  # attached to the release and the skipped tap only leaves Homebrew behind.
  tap:
    needs: [check, publish]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
      # `secrets` is not a context `if:` can read; map it into env and test that.
      TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
    steps:
      - name: Check out the tap
        if: env.TAP_TOKEN != ''
        uses: actions/checkout@v7
        with:
          repository: smeltery/homebrew-tap
          token: ${{ secrets.TAP_TOKEN }}
      - name: Update Formula/dune.rb
        if: env.TAP_TOKEN != ''
        run: |
          mkdir -p Formula
          gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" \
            --pattern dune.rb --dir Formula --clobber
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add Formula/dune.rb
          if git diff --cached --quiet; then
            echo "Formula/dune.rb is already at $VERSION"
          else
            git commit -m "dune $VERSION"
            git push
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Say the formula was not published
        if: env.TAP_TOKEN == ''
        run: |
          echo "::notice::TAP_TOKEN is not set — skipping the Homebrew tap update." \
            "dune.rb is attached to release $VERSION and can be copied to" \
            "smeltery/homebrew-tap as Formula/dune.rb by hand."
